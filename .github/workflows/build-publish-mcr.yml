# Upstream Azure workflow that publishes to MCR via a 1ES self-hosted pool.
# Disabled on this fork — image publishing is handled by upload-images.yml
# (turbopuffer ACR + Google Artifact Registry).

name: Build and publish to MCR
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-images:
    if: false
    permissions:
      contents: read
      id-token: write # This is required for requesting the JWT
    runs-on:
      labels: [self-hosted, "1ES.Pool=${{ vars.RELEASE_1ES_POOL }}"]
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - uses: ./.github/actions/install-deps

    - name: Build and publish image
      env:
        RELEASE_ACR: ${{ secrets.AZURE_REGISTRY }}
      run: |
        az login --identity
        ko version
        ./hack/release/release.sh
